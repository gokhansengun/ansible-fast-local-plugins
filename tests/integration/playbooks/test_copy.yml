---
- name: Integration tests for fast copy plugin
  hosts: local
  gather_facts: false
  vars:
    work_dir: /tmp/aflp_test_copy

  tasks:
    - name: Create work directory
      file:
        path: "{{ work_dir }}"
        state: directory

    # --- basic write ---
    - name: Copy content to file
      copy:
        content: "hello world"
        dest: "{{ work_dir }}/out.txt"
      register: r1

    - name: Assert first write changed
      assert:
        that:
          - r1.changed
          - r1.checksum is defined
          - r1['__produced_by_fast_plugin'] | default(false)

    - name: Verify file content
      shell:
        cmd: "cat {{ work_dir }}/out.txt"
      register: cat_out

    - name: Assert content matches
      assert:
        that:
          - cat_out.stdout == 'hello world'

    # --- idempotency ---
    - name: Copy same content again
      copy:
        content: "hello world"
        dest: "{{ work_dir }}/out.txt"
      register: r2

    - name: Assert second write is not changed
      assert:
        that:
          - not r2.changed

    # --- force=false ---
    - name: Copy with force=false to existing file
      copy:
        content: "new content"
        dest: "{{ work_dir }}/out.txt"
        force: false
      register: r3

    - name: Assert force=false did not overwrite
      assert:
        that:
          - not r3.changed

    # --- mode setting ---
    - name: Copy with mode
      copy:
        content: "secured"
        dest: "{{ work_dir }}/secured.txt"
        mode: "0600"
      register: r4

    - name: Stat the secured file
      stat:
        path: "{{ work_dir }}/secured.txt"
      register: s4

    - name: Assert mode is 0600
      assert:
        that:
          - s4.stat.mode == '0600'

    # --- src-based copy (local file -> file), the case that used to fall back ---
    - name: Create a source file to copy from
      copy:
        content: "ca bundle contents\n"
        dest: "{{ work_dir }}/source.crt"

    - name: Copy over a local file by src (fast path, no fallback)
      copy:
        src: "{{ work_dir }}/source.crt"
        dest: "{{ work_dir }}/copied.crt"
      register: r_src

    - name: Assert src copy ran on the fast path and changed
      assert:
        that:
          - r_src.changed
          - r_src['__produced_by_fast_plugin'] | default(false)

    - name: Read back the copied file
      slurp:
        src: "{{ work_dir }}/copied.crt"
      register: copied_back

    - name: Assert copied content matches the source
      assert:
        that:
          - (copied_back.content | b64decode) == "ca bundle contents\n"

    - name: Copy same src again (idempotent, still fast)
      copy:
        src: "{{ work_dir }}/source.crt"
        dest: "{{ work_dir }}/copied.crt"
      register: r_src2

    - name: Assert src copy is idempotent
      assert:
        that:
          - not r_src2.changed
          - r_src2['__produced_by_fast_plugin'] | default(false)

    # --- src copy into a directory dest places it by basename ---
    - name: Make a destination directory
      file:
        path: "{{ work_dir }}/destdir"
        state: directory

    - name: Copy a file into a directory dest
      copy:
        src: "{{ work_dir }}/source.crt"
        dest: "{{ work_dir }}/destdir"
      register: r_srcdir

    - name: Assert it landed inside the directory by basename
      assert:
        that:
          - r_srcdir.dest == work_dir ~ '/destdir/source.crt'
          - r_srcdir['__produced_by_fast_plugin'] | default(false)

    - name: Cleanup
      file:
        path: "{{ work_dir }}"
        state: absent
