---
- name: Integration tests for fast shell plugin
  hosts: local
  gather_facts: false
  vars:
    work_dir: /tmp/aflp_test_shell

  tasks:
    - name: Create work directory
      file:
        path: "{{ work_dir }}"
        state: directory

    # --- basic command ---
    - name: Run echo command
      shell:
        cmd: "echo hello"
      register: r

    - name: Assert echo output
      assert:
        that:
          - r.stdout == 'hello'
          - r.rc == 0
          - r.changed
          - r['__produced_by_fast_plugin'] | default(false)

    # --- failing command ---
    - name: Run failing command (ignore errors)
      shell:
        cmd: "exit 42"
      register: r_fail
      ignore_errors: true

    - name: Assert non-zero rc
      assert:
        that:
          - r_fail.rc == 42
          - r_fail.failed

    # --- chdir ---
    - name: Run pwd in work_dir
      shell:
        cmd: "pwd"
        chdir: "{{ work_dir }}"
      register: r_pwd

    - name: Assert chdir works
      assert:
        that:
          - work_dir in r_pwd.stdout

    # --- chdir supplied via the `args:` form (free-form cmd + args block) ---
    - name: Run pwd with chdir supplied via args
      shell: pwd
      args:
        chdir: "{{ work_dir }}"
      register: r_pwd_args

    - name: Assert chdir via args runs on the fast path in the right dir
      assert:
        that:
          - work_dir in r_pwd_args.stdout
          - r_pwd_args['__produced_by_fast_plugin'] | default(false)

    # --- chdir is path-expanded (env vars) on the fast path ---
    - name: Run pwd with chdir using an env-var path
      shell: pwd
      args:
        chdir: "$HOME"
      register: r_pwd_home

    - name: Assert $HOME was expanded for chdir
      assert:
        that:
          - r_pwd_home.stdout == lookup('env', 'HOME')
          - r_pwd_home['__produced_by_fast_plugin'] | default(false)

    # --- a missing chdir fails clearly, not with a raw subprocess error ---
    - name: Run with a nonexistent chdir (expect failure)
      shell: pwd
      args:
        chdir: "{{ work_dir }}/does-not-exist"
      register: r_badchdir
      ignore_errors: true

    - name: Assert missing chdir fails with a clear message
      assert:
        that:
          - r_badchdir.failed
          - "'change directory' in r_badchdir.msg"

    # --- creates ---
    - name: Create marker file
      copy:
        content: ""
        dest: "{{ work_dir }}/marker.txt"

    - name: Shell with creates - should skip
      shell:
        cmd: "echo should_not_run"
        creates: "{{ work_dir }}/marker.txt"
      register: r_creates

    - name: Assert creates caused skip
      assert:
        that:
          - r_creates.skipped | default(false)

    # --- removes ---
    - name: Shell with removes - should skip because file does not exist
      shell:
        cmd: "echo should_not_run"
        removes: "{{ work_dir }}/nonexistent.txt"
      register: r_removes

    - name: Assert removes caused skip
      assert:
        that:
          - r_removes.skipped | default(false)

    # --- stdin ---
    - name: Pass stdin to command
      shell:
        cmd: "cat"
        stdin: "from stdin"
      register: r_stdin

    - name: Assert stdin content received
      assert:
        that:
          - "'from stdin' in r_stdin.stdout"

    # --- a non-zero command rescued by failed_when is still a fast result ---
    # Mirrors a common probe: `kubectl get ...` that exits non-zero when absent,
    # with failed_when: false. It ran in-process, so it must carry the marker and
    # NOT be misreported as a fallback.
    - name: Probe-style command that exits non-zero, rescued by failed_when
      shell:
        cmd: "exit 3"
      register: r_probe
      failed_when: false
      changed_when: false

    - name: Assert the rescued non-zero command is marked as a fast result
      assert:
        that:
          - r_probe.rc == 3
          - not r_probe.failed
          - r_probe['__produced_by_fast_plugin'] | default(false)

    # --- environment is applied in-process, including templated values ---
    - name: Shell honoring a templated environment var on the fast path
      shell:
        cmd: 'echo "$GREETING"'
      environment:
        GREETING: "hello {{ work_dir | basename }}"
      register: r_env

    - name: Assert templated env var was honored on the fast path
      assert:
        that:
          - r_env.stdout == ('hello ' ~ (work_dir | basename))
          - r_env['__produced_by_fast_plugin'] | default(false)

    # --- timing fields ---
    - name: Assert timing fields present
      assert:
        that:
          - r.start is defined
          - r.end is defined
          - r.delta is defined

    - name: Cleanup
      file:
        path: "{{ work_dir }}"
        state: absent
