---
- name: Integration tests for fast k8s plugin
  hosts: local
  gather_facts: false
  vars:
    kubeconfig: /kubeconfig/config
    ns: test-ns
    cm_name: aflp-test-cm

  tasks:
    # ------------------------------------------------------------------ #
    # Cleanup: ensure test ConfigMap does not exist before we start       #
    # ------------------------------------------------------------------ #
    - name: Delete test ConfigMap if it exists (pre-test cleanup)
      kubernetes.core.k8s:
        state: absent
        kind: ConfigMap
        name: "{{ cm_name }}"
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"

    # ------------------------------------------------------------------ #
    # state: present – create                                             #
    # ------------------------------------------------------------------ #
    - name: Create ConfigMap (state=present)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ cm_name }}"
            namespace: "{{ ns }}"
          data:
            key1: value1
      register: r_create

    - name: Assert ConfigMap was created
      assert:
        that:
          - not r_create.failed | default(false)
          - r_create.changed
          - r_create['__produced_by_fast_plugin'] | default(false)

    # ------------------------------------------------------------------ #
    # state: present – idempotency                                        #
    # ------------------------------------------------------------------ #
    - name: Apply same ConfigMap again (idempotency)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ cm_name }}"
            namespace: "{{ ns }}"
          data:
            key1: value1
      register: r_idem

    - name: Assert idempotent apply reports no change
      assert:
        that:
          - not r_idem.failed | default(false)
          - not r_idem.changed

    # ------------------------------------------------------------------ #
    # state: present – update                                             #
    # ------------------------------------------------------------------ #
    - name: Update ConfigMap with new data
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ cm_name }}"
            namespace: "{{ ns }}"
          data:
            key1: value1
            key2: value2
      register: r_update

    - name: Assert update was applied
      assert:
        that:
          - not r_update.failed | default(false)
          - r_update.changed

    # ------------------------------------------------------------------ #
    # state: latest – idempotent like present                            #
    # ------------------------------------------------------------------ #
    - name: Apply same definition with state=latest (no changes expected)
      kubernetes.core.k8s:
        state: latest
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ cm_name }}"
            namespace: "{{ ns }}"
          data:
            key1: value1
            key2: value2
      register: r_latest

    - name: Assert state=latest succeeded
      assert:
        that:
          - not r_latest.failed | default(false)
          - not r_latest.changed

    # ------------------------------------------------------------------ #
    # state: patched – add a label                                        #
    # ------------------------------------------------------------------ #
    - name: Patch ConfigMap to add a label
      kubernetes.core.k8s:
        state: patched
        kind: ConfigMap
        api_version: v1
        name: "{{ cm_name }}"
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"
        definition:
          metadata:
            labels:
              patched-by: aflp
      register: r_patch

    - name: Assert patch succeeded
      assert:
        that:
          - not r_patch.failed | default(false)
          - r_patch.changed

    # ------------------------------------------------------------------ #
    # state: absent – delete                                              #
    # ------------------------------------------------------------------ #
    - name: Delete the ConfigMap
      kubernetes.core.k8s:
        state: absent
        kind: ConfigMap
        name: "{{ cm_name }}"
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"
      register: r_delete

    - name: Assert ConfigMap was deleted
      assert:
        that:
          - not r_delete.failed | default(false)
          - r_delete.changed

    # ------------------------------------------------------------------ #
    # state: absent – idempotency                                         #
    # ------------------------------------------------------------------ #
    - name: Delete same ConfigMap again (idempotency)
      kubernetes.core.k8s:
        state: absent
        kind: ConfigMap
        name: "{{ cm_name }}"
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"
      register: r_delete_idem

    - name: Assert absent is idempotent
      assert:
        that:
          - not r_delete_idem.failed | default(false)
          - not r_delete_idem.changed

    # ------------------------------------------------------------------ #
    # state: absent – missing kind must fail                              #
    # ------------------------------------------------------------------ #
    - name: Call state=absent without kind (expect failure)
      kubernetes.core.k8s:
        state: absent
        name: some-resource
        kubeconfig: "{{ kubeconfig }}"
      register: r_no_kind
      ignore_errors: true

    - name: Assert missing kind fails
      assert:
        that:
          - r_no_kind.failed
          - "'kind' in r_no_kind.msg"

    # ------------------------------------------------------------------ #
    # Non-core API: create and delete a Deployment                        #
    # ------------------------------------------------------------------ #
    - name: Create a minimal Deployment (apps/v1)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: aflp-test-deploy
            namespace: "{{ ns }}"
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: aflp-test
            template:
              metadata:
                labels:
                  app: aflp-test
              spec:
                containers:
                  - name: pause
                    image: registry.k8s.io/pause:3.9
      register: r_deploy

    - name: Assert Deployment was created
      assert:
        that:
          - not r_deploy.failed | default(false)
          - r_deploy.changed

    - name: Delete the Deployment
      kubernetes.core.k8s:
        state: absent
        kind: Deployment
        api_version: apps/v1
        name: aflp-test-deploy
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"
      register: r_deploy_delete

    - name: Assert Deployment was deleted
      assert:
        that:
          - not r_deploy_delete.failed | default(false)
          - r_deploy_delete.changed

    # ------------------------------------------------------------------ #
    # definition as YAML string (simulates lookup('template', ...))       #
    # ------------------------------------------------------------------ #
    - name: Create ConfigMap from YAML string definition (lookup template pattern)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition: "{{ lookup('template', playbook_dir + '/../templates/rbac_cm.yml.j2') }}"
      vars:
        cm_template_name: "{{ cm_name }}-from-template"
      register: r_yaml_def

    - name: Assert ConfigMap from YAML string was created
      assert:
        that:
          - not r_yaml_def.failed | default(false)
          - r_yaml_def.changed

    - name: Apply same YAML string definition again (idempotency)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition: "{{ lookup('template', playbook_dir + '/../templates/rbac_cm.yml.j2') }}"
      vars:
        cm_template_name: "{{ cm_name }}-from-template"
      register: r_yaml_def_idem

    - name: Assert YAML string definition apply is idempotent
      assert:
        that:
          - not r_yaml_def_idem.failed | default(false)
          - not r_yaml_def_idem.changed

    - name: Delete ConfigMap created from YAML string definition
      kubernetes.core.k8s:
        state: absent
        kind: ConfigMap
        name: "{{ cm_name }}-from-template"
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"

    # ------------------------------------------------------------------ #
    # definition as multi-document YAML string (3 objects via template)   #
    # ------------------------------------------------------------------ #
    - name: Apply multi-document YAML template (ClusterRole + ClusterRoleBinding + ServiceAccount)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition: "{{ lookup('template', playbook_dir + '/../templates/rbac_multidoc.yml.j2') }}"
      register: r_multidoc

    - name: Assert multi-document apply succeeded and reported changes
      assert:
        that:
          - not r_multidoc.failed | default(false)
          - r_multidoc.changed

    - name: Apply same multi-document template again (idempotency)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition: "{{ lookup('template', playbook_dir + '/../templates/rbac_multidoc.yml.j2') }}"
      register: r_multidoc_idem

    - name: Assert multi-document apply is idempotent
      assert:
        that:
          - not r_multidoc_idem.failed | default(false)
          - not r_multidoc_idem.changed

    - name: Delete ClusterRole created by multi-document template
      kubernetes.core.k8s:
        state: absent
        kind: ClusterRole
        api_version: rbac.authorization.k8s.io/v1
        name: registry-creds
        kubeconfig: "{{ kubeconfig }}"

    - name: Delete ClusterRoleBinding created by multi-document template
      kubernetes.core.k8s:
        state: absent
        kind: ClusterRoleBinding
        api_version: rbac.authorization.k8s.io/v1
        name: registry-creds
        kubeconfig: "{{ kubeconfig }}"

    - name: Delete ServiceAccount created by multi-document template
      kubernetes.core.k8s:
        state: absent
        kind: ServiceAccount
        name: registry-creds
        namespace: kube-system
        kubeconfig: "{{ kubeconfig }}"

    # ------------------------------------------------------------------ #
    # state: absent with definition from template (all 3 objects at once) #
    # ------------------------------------------------------------------ #
    - name: Re-create resources via multi-document template (pre-condition for absent test)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition: "{{ lookup('template', playbook_dir + '/../templates/rbac_multidoc.yml.j2') }}"

    - name: Delete all 3 resources using state=absent with the same template definition
      kubernetes.core.k8s:
        state: absent
        kubeconfig: "{{ kubeconfig }}"
        definition: "{{ lookup('template', playbook_dir + '/../templates/rbac_multidoc.yml.j2') }}"
      register: r_absent_def

    - name: Assert state=absent with definition deleted the resources
      assert:
        that:
          - not r_absent_def.failed | default(false)
          - r_absent_def.changed

    - name: Apply state=absent with same definition again (idempotency)
      kubernetes.core.k8s:
        state: absent
        kubeconfig: "{{ kubeconfig }}"
        definition: "{{ lookup('template', playbook_dir + '/../templates/rbac_multidoc.yml.j2') }}"
      register: r_absent_def_idem

    - name: Assert state=absent with definition is idempotent
      assert:
        that:
          - not r_absent_def_idem.failed | default(false)
          - not r_absent_def_idem.changed

    # ------------------------------------------------------------------ #
    # state: present with a PARTIAL definition over a kubectl-applied     #
    # resource.  `kubectl apply` would three-way-merge against            #
    # last-applied-configuration and delete every omitted field (nulling  #
    # spec.selector / containers, which the API server then rejects);     #
    # state=present must PATCH, like kubernetes.core does.                #
    # ------------------------------------------------------------------ #
    - name: Write the Deployment manifest for the kubectl-apply pre-condition
      copy:
        dest: /tmp/aflp-partial-deploy.yml
        content: |
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: aflp-partial-deploy
            namespace: {{ ns }}
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: aflp-partial
            template:
              metadata:
                labels:
                  app: aflp-partial
              spec:
                containers:
                  - name: pause
                    image: registry.k8s.io/pause:3.9

    - name: Create the Deployment with kubectl apply (records last-applied-configuration)
      shell:
        cmd: "kubectl --kubeconfig {{ kubeconfig }} apply -f /tmp/aflp-partial-deploy.yml"

    - name: Add hostAliases with a partial definition (state=present)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: aflp-partial-deploy
            namespace: "{{ ns }}"
          spec:
            template:
              spec:
                hostAliases:
                  - ip: 10.0.0.1
                    hostnames:
                      - rancher.aflp.localdev
      register: r_partial

    - name: Read the Deployment back
      kubernetes.core.k8s_info:
        api_version: apps/v1
        kind: Deployment
        name: aflp-partial-deploy
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"
      register: r_partial_info

    - name: Assert the partial definition merged and pruned nothing
      vars:
        spec: "{{ r_partial_info.resources[0].spec }}"
      assert:
        that:
          - not r_partial.failed | default(false)
          - r_partial.changed
          - r_partial.method == 'update'
          - spec.selector.matchLabels.app == 'aflp-partial'
          - spec.template.spec.containers | length == 1
          - spec.template.spec.hostAliases[0].ip == '10.0.0.1'

    - name: Apply the same partial definition again (idempotency)
      kubernetes.core.k8s:
        state: present
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: aflp-partial-deploy
            namespace: "{{ ns }}"
          spec:
            template:
              spec:
                hostAliases:
                  - ip: 10.0.0.1
                    hostnames:
                      - rancher.aflp.localdev
      register: r_partial_idem

    - name: Assert the partial patch is idempotent
      assert:
        that:
          - not r_partial_idem.failed | default(false)
          - not r_partial_idem.changed

    - name: Delete the partially patched Deployment
      kubernetes.core.k8s:
        state: absent
        kind: Deployment
        api_version: apps/v1
        name: aflp-partial-deploy
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"

    # ------------------------------------------------------------------ #
    # state: patched on a missing resource — warn, never create           #
    # ------------------------------------------------------------------ #
    - name: Patch a ConfigMap that does not exist
      kubernetes.core.k8s:
        state: patched
        kind: ConfigMap
        api_version: v1
        name: aflp-ghost-cm
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"
        definition:
          metadata:
            labels:
              patched-by: aflp
      register: r_patch_ghost

    - name: Read back the ConfigMap that must not have been created
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: aflp-ghost-cm
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"
      register: r_patch_ghost_info

    - name: Assert state=patched did not create the missing resource
      assert:
        that:
          - not r_patch_ghost.failed | default(false)
          - not r_patch_ghost.changed
          - r_patch_ghost_info.resources | length == 0

    # ------------------------------------------------------------------ #
    # apply: true — still goes through `kubectl apply`                    #
    # ------------------------------------------------------------------ #
    - name: Create a ConfigMap with apply=true
      kubernetes.core.k8s:
        state: present
        apply: true
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ cm_name }}-applied"
            namespace: "{{ ns }}"
          data:
            key1: value1
      register: r_apply

    - name: Apply the same ConfigMap again with apply=true (idempotency)
      kubernetes.core.k8s:
        state: present
        apply: true
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ cm_name }}-applied"
            namespace: "{{ ns }}"
          data:
            key1: value1
      register: r_apply_idem

    - name: Assert apply=true creates then no-ops
      assert:
        that:
          - not r_apply.failed | default(false)
          - r_apply.changed
          - not r_apply_idem.failed | default(false)
          - not r_apply_idem.changed

    # ------------------------------------------------------------------ #
    # force: true — replace (PUT), not delete-and-recreate                #
    # ------------------------------------------------------------------ #
    - name: Replace the ConfigMap with force=true
      kubernetes.core.k8s:
        state: present
        force: true
        kubeconfig: "{{ kubeconfig }}"
        definition:
          apiVersion: v1
          kind: ConfigMap
          metadata:
            name: "{{ cm_name }}-applied"
            namespace: "{{ ns }}"
          data:
            key2: value2
      register: r_force

    - name: Read the replaced ConfigMap back
      kubernetes.core.k8s_info:
        kind: ConfigMap
        name: "{{ cm_name }}-applied"
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"
      register: r_force_info

    - name: Assert force replaced the whole resource
      assert:
        that:
          - not r_force.failed | default(false)
          - r_force.changed
          - r_force.method == 'replace'
          - r_force_info.resources[0].data.key2 == 'value2'
          - r_force_info.resources[0].data.key1 is not defined

    - name: Delete the ConfigMap used by the apply/force tests
      kubernetes.core.k8s:
        state: absent
        kind: ConfigMap
        name: "{{ cm_name }}-applied"
        namespace: "{{ ns }}"
        kubeconfig: "{{ kubeconfig }}"
