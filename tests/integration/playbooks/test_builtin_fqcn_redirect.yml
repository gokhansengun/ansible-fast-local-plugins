---
# Verifies the aflp_builtin_redirect callback routes fully-qualified
# ansible.builtin.<name> tasks to the fast local action plugins, without any
# change to how the tasks are written. The fast template plugin returns a
# minimal result dict (changed/checksum/dest/src); the stock builtin returns a
# rich dict including state/gid/mode/size. We use that to tell which one ran.
- name: Integration tests for ansible.builtin.* -> fast plugin redirect
  hosts: local
  gather_facts: false
  vars:
    work_dir: /tmp/aflp_test_builtin_redirect
    recipient: "Redirect"

  tasks:
    - name: Create work directory
      file:
        path: "{{ work_dir }}"
        state: directory

    # --- the redirect itself: FQCN must hit the fast plugin ---
    - name: Render template via FQCN ansible.builtin.template
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/greeting.j2"
        dest: "{{ work_dir }}/fqcn.txt"
      register: r_fqcn

    - name: Read rendered FQCN output
      slurp:
        src: "{{ work_dir }}/fqcn.txt"
      register: fqcn_content

    - name: FQCN task rendered correctly AND ran through the fast plugin
      assert:
        that:
          - r_fqcn.changed
          - "(fqcn_content.content | b64decode) == 'Hello, Redirect!\nGenerated by: fast_template\n'"
          # Primary proof: the fast plugin stamps this marker; the stock builtin never does.
          - r_fqcn['__produced_by_fast_plugin'] | default(false)
          # Corroborating fingerprint: the fast plugin does NOT emit these builtin-only keys.
          - "'state' not in r_fqcn"
          - "'gid' not in r_fqcn"
          - r_fqcn.checksum is defined
        fail_msg: >-
          ansible.builtin.template did not route to the fast plugin
          (result keys: {{ r_fqcn.keys() | list | sort }})

    # --- parity: FQCN and bare short name produce identical output ---
    - name: Render the same template via bare short name
      template:
        src: "{{ playbook_dir }}/../templates/greeting.j2"
        dest: "{{ work_dir }}/bare.txt"
      register: r_bare

    - name: FQCN and bare names yield the same checksum
      assert:
        that:
          - r_fqcn.checksum == r_bare.checksum

    # --- idempotency through the FQCN path ---
    - name: Render via FQCN again
      ansible.builtin.template:
        src: "{{ playbook_dir }}/../templates/greeting.j2"
        dest: "{{ work_dir }}/fqcn.txt"
      register: r_fqcn_again

    - name: Second FQCN render reports no change but still ran the fast plugin
      assert:
        that:
          - not r_fqcn_again.changed
          - r_fqcn_again['__produced_by_fast_plugin'] | default(false)

    # --- safety: a builtin WITHOUT a local override is left untouched ---
    - name: A non-overridden builtin still works normally
      ansible.builtin.set_fact:
        redirect_smoke: ok
      register: r_setfact

    - name: set_fact (no local override) behaved normally and is NOT marked
      assert:
        that:
          - redirect_smoke == 'ok'
          - not r_setfact.failed | default(false)
          # A builtin with no fast override must not carry the marker.
          - "'__produced_by_fast_plugin' not in r_setfact"

    - name: Clean up
      file:
        path: "{{ work_dir }}"
        state: absent
