services:
  dind:
    image: docker:29-dind
    privileged: true
    environment:
      DOCKER_TLS_CERTDIR: ""
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "docker", "info"]
      interval: 5s
      timeout: 10s
      retries: 15
      # Grace for cold starts while the host is busy building the controller
      # image (probe failures in this window don't count against retries).
      start_period: 60s

  kind-setup:
    build:
      context: kind-setup
    environment:
      DOCKER_HOST: tcp://dind:2375
      KUBECONFIG: /kubeconfig/config
    depends_on:
      dind:
        condition: service_healthy
    volumes:
      - kubeconfig:/kubeconfig
    networks:
      - test-net

  vault:
    image: hashicorp/vault:1.21.4
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: root
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    networks:
      - test-net
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 5s
      retries: 10
      # Grace for cold starts while the host is busy building the controller
      # image (probe failures in this window don't count against retries).
      start_period: 60s

  vault-seed:
    image: hashicorp/vault:1.21.4
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
    volumes:
      - ./vault-seed.sh:/vault-seed.sh:ro
    command: sh /vault-seed.sh
    networks:
      - test-net

  ssh-target:
    build:
      context: ssh-target
    volumes:
      - ssh-keys:/ssh-keys
    networks:
      - test-net
    healthcheck:
      test: ["CMD-SHELL", "test -f /ssh-keys/id_ed25519 && ssh-keyscan -p 22 localhost >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 25

  controller:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.12}
        ANSIBLE_CORE_VERSION: ${ANSIBLE_CORE_VERSION:-2.19.3}
        HASHIVAULT_MODULE_VERSION: ${HASHIVAULT_MODULE_VERSION:-5.4.0}
    depends_on:
      vault-seed:
        condition: service_completed_successfully
      kind-setup:
        condition: service_completed_successfully
      ssh-target:
        condition: service_healthy
    volumes:
      - ..:/workspace:ro
      - kubeconfig:/kubeconfig:ro
      - ssh-keys:/ssh-keys:ro
      - test-results:/test-results
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: root
      KUBECONFIG: /kubeconfig/config
      COVERAGE_FILE: /test-results/.coverage
    networks:
      - test-net
    working_dir: /workspace
    command: "sh -c \"${PYTEST_CMD:-pytest tests/ -v --cov=ansible/plugins/action_plugins --cov-report=term-missing --cov-fail-under=80}\""

volumes:
  kubeconfig:
  ssh-keys:
  test-results:

networks:
  test-net:
    driver: bridge
    ipam:
      config:
        # Pinned to a subnet the corporate VPN does not push routes for.
        # Docker's auto-assigned 172.19.0.0/16 collided with more-specific
        # VPN routes (172.19.0.0/24 via tun0), which blackholed all reply
        # traffic to the containers and broke registry pulls inside dind.
        - subnet: 172.28.0.0/16
