name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    permissions:
      checks: write
      contents: read

  release:
    name: Create GitHub Release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Package plugins
        run: |
          zip -r ansible-fast-local-plugins-${{ github.ref_name }}.zip ansible/ \
            --exclude "ansible/*/__pycache__/*" \
            --exclude "ansible/*.pyc"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: ansible-fast-local-plugins-${{ github.ref_name }}.zip
