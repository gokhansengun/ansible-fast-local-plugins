name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

jobs:
  test:
    name: "py${{ matrix.python-version }} / ansible-core ${{ matrix.ansible-core }}"
    runs-on: ubuntu-latest

    permissions:
      checks: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            ansible-core: "2.19.3"
            hashivault-module: "5.4.0"
          - python-version: "3.14"
            ansible-core: "2.20.5"
            hashivault-module: "5.6.0"

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build controller image
        run: |
          docker compose -f docker/docker-compose.yml build controller
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          ANSIBLE_CORE_VERSION: ${{ matrix.ansible-core }}
          HASHIVAULT_MODULE_VERSION: ${{ matrix.hashivault-module }}

      - name: Run full test suite
        run: |
          mkdir -p /tmp/test-results
          docker compose -f docker/docker-compose.yml run --rm \
            --volume /tmp/test-results:/test-results \
            controller \
            pytest tests/ -v \
              --cov=ansible/plugins/action_plugins \
              --cov-report=term-missing \
              --cov-fail-under=80 \
              --junitxml=/test-results/junit.xml
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          ANSIBLE_CORE_VERSION: ${{ matrix.ansible-core }}
          HASHIVAULT_MODULE_VERSION: ${{ matrix.hashivault-module }}

      - name: Generate coverage summary
        if: always()
        run: |
          docker compose -f docker/docker-compose.yml run --rm \
            --no-deps \
            --entrypoint "" \
            --volume /tmp/test-results:/test-results \
            controller \
            sh -c "coverage report --format=markdown > /test-results/coverage-summary.md 2>&1" || true
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          ANSIBLE_CORE_VERSION: ${{ matrix.ansible-core }}
          HASHIVAULT_MODULE_VERSION: ${{ matrix.hashivault-module }}

      - name: Add coverage to job summary
        if: always()
        run: |
          if [ -f /tmp/test-results/coverage-summary.md ]; then
            echo "## Coverage" >> $GITHUB_STEP_SUMMARY
            cat /tmp/test-results/coverage-summary.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Test report
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: "Tests (py${{ matrix.python-version }} / ansible-core ${{ matrix.ansible-core }})"
          path: /tmp/test-results/junit.xml
          reporter: java-junit
          fail-on-error: false

      - name: Tear down stack
        if: always()
        run: docker compose -f docker/docker-compose.yml down -v --remove-orphans
        env:
          PYTHON_VERSION: ${{ matrix.python-version }}
          ANSIBLE_CORE_VERSION: ${{ matrix.ansible-core }}
          HASHIVAULT_MODULE_VERSION: ${{ matrix.hashivault-module }}
