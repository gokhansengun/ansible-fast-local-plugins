# Stock ansible-core config used by the benchmark harness for the "stock"
# baseline. It deliberately omits `action_plugins` and `callback_plugins`, so
# bare task names (stat:, copy:, ...) resolve to the standard ansible-core
# modules instead of the fast local action plugins. The benchmark runner points
# ANSIBLE_CONFIG at this file for the baseline and at the repo's ./ansible.cfg
# for the fast run.
[defaults]
host_key_checking  = False
interpreter_python = auto_silent
stdout_callback    = default
